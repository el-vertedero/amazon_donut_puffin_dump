/*  
    Parametric EQ Configuration EQv5.4
    options for FilterType : LOW_PASS, HIGH_PASS, BAND_PASS, NOTCH, PEAK, LOW_SHELF, HIGH_SHELF, BYPASS
    Fc : Cutoff/Center Frequency in Hertz
    Q:   Quality Factor
    GaindB: Gain in dB

*/

{
    "Bypass"            : false,
    "NumBiquads"        : 4,   // MUST be a multiple of 4

    "Biquad Definitions":
    [
        // Biquad 1. Low shelf to attenuate frequencies below 275 Hz
        {
            "FilterType" : "LOW_SHELF",
            "Fc"         : 700,
            "Q"          : 0.7,
            "GaindB"     : -3.0
        },
        // Biquad 2. High shelf to attenuate frequencies above 650 Hz
        {
            "FilterType" : "HIGH_SHELF",
            "Fc"         : 650,
            "Q"          : 0.7,
            "GaindB"     : -4.5
        },
        // Biquad 3. High shelf to boost frequencies above 6000 Hz
        {
            "FilterType" : "HIGH_SHELF",
            "Fc"         : 6000,
            "Q"          : 0.8,
            "GaindB"     : 16.0 //20.0 //23.0
        },
        // Biquad 4. Peak to attenuate frequencies around 4000 Hz
        {
            "FilterType" : "PEAK",
            "Fc"         : 3150,
            "Q"          : 2.5,
            "GaindB"     : -7.0 //-8.0
        }
   ]
}
